# IMPORTANT — GIT WORKFLOW
# Repo: github.com/mrgibbage/local-mcp-server
# After any change to tracked files: git -C /srv/local-mcp-server push origin master
# Then pull in VS Code on Windows (C:/github-projects/local-mcp-server).
# config.yaml and keys/ are gitignored — edit manually on docker-server only.

services:
  homelab-mcp:
    build: .
    container_name: homelab-mcp
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "diun.enable=false"
    ports:
      - "8090:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./keys:/keys:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/windows/holocron:/mnt/windows/holocron:rw
      - /mnt/windows/claude:/mnt/windows/claude:ro
    env_file:
      - /etc/homelab/homelab-mcp.env
    environment:
      - CONFIG_PATH=/app/config.yaml

  # homelab-mcp-ro (port 8091, public bearer-auth) decommissioned 2026-08-18 --
  # its Cloudflare Tunnel route was deleted 2026-06-07 after a credential
  # spill (see holocron incident-2026-06-07-credential-rotation-spill.md),
  # but the container itself kept running unnoticed for 5 weeks. Confirmed
  # dead end-to-end (no Tunnel route, no Access policy, no working TLS) and
  # rarely used even when it worked, so fully removed rather than repaired.
  # See holocron artificial-intelligence/claude-mcp/homelab-mcp.md changelog.

  # LAN-only, tokenless, read-only instance for untrusted local interfaces
  # (e.g. the Mattermost Agents plugin, whose MCP client treats a 401 as an
  # OAuth trigger). No MCP_AUTH_TOKEN (uses only the base env file, not
  # homelab-mcp-ro.env), and no Caddy/CF route — must never be exposed
  # publicly. Same read-only toolset as homelab-mcp-ro.
  homelab-mcp-lan:
    build: .
    container_name: homelab-mcp-lan
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "diun.enable=false"
    ports:
      - "192.168.0.231:8092:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./keys:/keys:ro
    env_file:
      - /etc/homelab/homelab-mcp.env
    environment:
      - CONFIG_PATH=/app/config.yaml
      # Same read-only set as 8091 PLUS ha_light_control (whitelisted lights only)
      # PLUS holocron_git_status/holocron_sync_push (hardcoded holocron repo paths only).
      - "MCP_ENABLED_TOOLS=list_hosts,docker_ps,docker_stats,docker_logs,docker_network_list,docker_capabilities,docker_restart,loki_query,disk_usage,memory_usage,systemctl_status,systemctl_list,proxmox_vm_list,proxmox_task_status,proxmox_snapshot_list,proxmox_storage_info,read_file,grep_file,tail_file,list_directory,stat_file,rclone_ls,http_get,cloudflare_list_tunnel_routes,cloudflare_list_access_policies,caddy_list_routes,opnsense_list_dhcp_leases,validate_config,ha_get_states,ha_get_state,ha_render_template,ha_get_history,ha_get_logbook,ha_list_automations,homelab_api_get,ha_light_control,holocron_git_status,holocron_sync_push"

  # LAN-only, tokenless instance for FarmorrowFlix (media-request Telegram bot).
  # Narrower than homelab-mcp-lan on purpose: only Seerr + Tautulli, nothing that
  # can touch Docker/HA/Proxmox/OPNsense/*arr/SAB — this instance may end up
  # serving a broader Telegram audience than Spock's. No Caddy/CF route — must
  # never be exposed publicly, same rule as homelab-mcp-lan.
  homelab-mcp-media:
    build: .
    container_name: homelab-mcp-media
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "diun.enable=false"
    ports:
      - "192.168.0.231:8093:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./keys:/keys:ro
    env_file:
      - /etc/homelab/homelab-mcp.env
    environment:
      - CONFIG_PATH=/app/config.yaml
      - "MCP_ENABLED_TOOLS=seerr_search,seerr_trending,seerr_discover,seerr_recommendations,seerr_media_details,seerr_request_media,tautulli_activity,tautulli_server_info,tautulli_library_stats"
